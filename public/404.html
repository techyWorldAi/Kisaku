<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Kisaku</title>
    <script type="text/javascript">
      // This script takes the intended path and converts it into a safe parameter string
      var l = window.location;
    var path = l.pathname.replace(/^\/+/, '').replace(/&/g, '~and~');
    var query = l.search ? '&' + l.search.slice(1).replace(/&/g, '&') : '';
    l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?p=' + encodeURIComponent(path) + query + l.hash);
    </script>
  </head>
  <body>
  </body>
</html>
