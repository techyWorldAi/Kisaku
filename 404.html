<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Kisaku</title>
    <script type="text/javascript">
      // This script takes the intended path and converts it into a safe parameter string
      var l = window.location;
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.split('/').slice(0, 1).join('/') + '/?p=' + l.pathname.slice(1).replace(/&/g, '~and~') + (l.search ? '&' + l.search.slice(1) : '') + l.hash);
    </script>
  </head>
  <body>
  </body>
</html>
